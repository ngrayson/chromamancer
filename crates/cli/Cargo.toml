[package]
name = "chromamancer"
version = "0.1.0"
edition = "2021"
authors = ["wiz <windows@example.com>"]
description = "Spec-driven desktop theming: live apply, Nix/HM, theme packs (theme.jsonc), multi-target (Kitty, GTK, Qt, Quickshell, Albert, Hyprland)"
license = "MIT"
repository = "https://github.com/wiz/chromamancer"
readme = "../../README.md"
keywords = ["cli", "terminal", "theming", "desktop"]
categories = ["command-line-utilities"]

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "5.0"
json_comments = "0.2"
ratatui = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[[bin]]
name = "chromamancer"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
