[package]
name = "chromamancer"
version = "0.1.0"
edition = "2021"
authors = ["wiz <windows@example.com>"]
description = "Spec-driven desktop theming: live apply, Nix/HM, scheme packs, multi-target (Kitty, GTK, Qt, Quickshell, Albert, Hyprland)"
license = "MIT"
repository = "https://github.com/wiz/chromamancer"
readme = "../../README.md"
keywords = ["cli", "terminal", "theming", "desktop"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.26"
crossterm = "0.28"

[dev-dependencies]

[[bin]]
name = "chromamancer"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
